apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CRDs are applied separately (`kubectl apply -f ../crd/bases-go/`) — kustomize
  # forbids '../' file refs that escape the kustomization root without
  # --load-restrictor, which `kubectl apply -k` doesn't expose.
  - namespace.yaml
  - operator.yaml
  - api.yaml
  - trigger.yaml
# Images are published by .github/workflows/docker.yml on every push to main.
images:
  - name: boilerhouse-operator
    newName: ghcr.io/zdavison/boilerhouse/operator
    newTag: latest
  - name: boilerhouse-api
    newName: ghcr.io/zdavison/boilerhouse/api
    newTag: latest
  - name: boilerhouse-trigger
    newName: ghcr.io/zdavison/boilerhouse/trigger
    newTag: latest
